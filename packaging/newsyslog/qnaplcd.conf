# qnaplcd-menu: rotate the LCD menu's log (qnaplcd_logfile in rc.conf;
# change the path here too if you move it). daemon(8) runs with -H, so the
# SIGHUP newsyslog sends to the pidfile makes it reopen the file.
# logfilename          [owner:group]  mode count size(KB) when  flags [/pid_file]
/var/log/qnaplcd.log   root:wheel     600  5     1000     *     JC    /var/run/qnaplcd.pid

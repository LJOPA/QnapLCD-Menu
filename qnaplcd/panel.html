<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front panel</title>
<style>
  :root {
    --bg: #1b1d21;
    --chassis: #26292d;
    --chassis-low: #1f2125;
    --band: #0e0f11;
    --edge: #3a3e44;
    --text: #c9ccd1;
    --muted: #7d828a;
    --lcd-on: #2f6fd6;
    --lcd-on-edge: #4f8ae8;
    --lcd-off: #17233a;
    --char-on: #eef4ff;
    --char-off: #3b4a66;
    --led-off: #2a2d31;
    --green: #3ddc6a;
    --red: #ff4a3d;
    --amber: #ff9a2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: min(760px, 100%); }

  /*
   * Laid out like the TS-x69 front: a narrow left section with the name,
   * and to its right a dark band holding the display, the two buttons and
   * the small LEDs. One line of lights runs across the front: where the NAS
   * has its power strip, this page's connection light; then each drive bay's
   * health strip and activity dot, with a label underneath.
   * Sizes are in cqi (percent of the chassis width) so it scales as one.
   */
  .chassis {
    container-type: inline-size;
    display: grid;
    grid-template-columns: 22% 1fr;
    grid-template-rows: auto auto 1fr;
    background: linear-gradient(180deg, var(--chassis), var(--chassis-low));
    border: 1px solid #000;
    border-radius: 2.2cqi 2.2cqi .8cqi .8cqi;
    box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    overflow: hidden;
  }
  .label {
    font-size: clamp(7px, 1.25cqi, 11px);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  /* left section */
  .side-top { grid-area: 1 / 1; padding: 4.4cqi 3.4cqi; }
  #host {
    margin: 0;
    font-size: clamp(9px, 2.6cqi, 22px);
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #e3e5e8;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* display band */
  .band {
    grid-area: 1 / 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 3cqi;
    padding: 3cqi 2.4cqi 2cqi 2.4cqi;
    background: linear-gradient(170deg, #1a1c1f, var(--band) 45%);
    border-left: 1px solid #000;
  }
  .lcd-area { display: flex; justify-content: flex-end; align-items: center; gap: 2cqi; }

  /* LCD: 2 rows x 16 character cells */
  .lcd {
    container-type: inline-size;
    width: 50cqi;
    background: var(--lcd-off);
    border: 2px solid #050607;
    padding: 1.1cqi 1.4cqi;
    transition: background .25s, box-shadow .25s;
  }
  .lcd.lit {
    background: radial-gradient(ellipse at center, var(--lcd-on-edge), var(--lcd-on) 75%);
    box-shadow: 0 0 2.4cqi rgba(79,138,232,.35);
  }
  .row { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1.2cqi; }
  .row + .row { margin-top: 1.6cqi; }
  .cell {
    aspect-ratio: 5 / 8;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.05);
    border-radius: 1px;
    font: 600 clamp(7px, 5.2cqi, 24px)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--char-off);
    white-space: pre;
  }
  .lcd.lit .cell { color: var(--char-on); text-shadow: 0 0 4px rgba(238,244,255,.5); background: rgba(255,255,255,.07); }

  /* Enter over Select, small rectangular keys beside the display */
  .buttons { display: flex; flex-direction: column; align-items: center; gap: .5cqi; }
  .buttons .keys { display: flex; flex-direction: column; gap: .5cqi; }
  .buttons button {
    width: 4.2cqi;
    height: 4.2cqi;
    min-width: 22px;
    min-height: 22px;
    padding: 0;
    border: 1px solid #000;
    border-radius: .5cqi;
    background: linear-gradient(180deg, #3d4147, #23262a);
    box-shadow: 0 2px 0 #050607, inset 0 1px 0 rgba(255,255,255,.08);
    cursor: pointer;
    transition: transform .05s, box-shadow .05s;
  }
  .buttons button:hover { background: linear-gradient(180deg, #474c53, #282b30); }
  .buttons button:focus-visible { outline: 2px solid var(--lcd-on-edge); outline-offset: 2px; }
  .buttons button:active, .buttons button.down {
    transform: translateY(2px);
    box-shadow: 0 0 0 #050607, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .buttons button:disabled { cursor: default; opacity: .5; }

  /* small round LEDs, bottom left of the band */
  .leds { display: flex; gap: 3.2cqi; }
  .led { display: flex; flex-direction: column; align-items: center; gap: .9cqi; }
  .lamp {
    background: var(--led-off);
    border: 1px solid #000;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.6);
  }
  .dot { width: 1.5cqi; height: 1.5cqi; min-width: 7px; min-height: 7px; border-radius: 50%; }
  .lamp.green { background: var(--green); box-shadow: 0 0 1.2cqi var(--green); }
  .lamp.red   { background: var(--red);   box-shadow: 0 0 1.2cqi var(--red); }
  /* red on blinker 2 at ~1 Hz, green underneath: alternates */
  .lamp.alternate { animation: red-green 1s steps(1, end) infinite; }
  @keyframes red-green {
    0%  { background: var(--red);   box-shadow: 0 0 1.2cqi var(--red); }
    50% { background: var(--green); box-shadow: 0 0 1.2cqi var(--green); }
  }
  .led.undriven .lamp { opacity: .55; }
  /* activity fades rather than blinks: a fast-blinking LED reads as dim */
  #lan, .act { transition: background .4s, box-shadow .4s; }
  /* LAN: amber with link, dimmed while there is traffic */
  .lamp.amber { background: var(--amber); box-shadow: 0 0 1.2cqi var(--amber); }
  .lamp.amber-dim {
    background: color-mix(in srgb, var(--amber) 45%, var(--led-off));
    box-shadow: 0 0 .6cqi color-mix(in srgb, var(--amber) 40%, transparent);
  }

  /* one line of lights across the front: connection, then each bay */
  .strips {
    grid-row: 2;
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 22% 1fr;
    background: #111214;
    border-top: 1px solid #000;
    border-bottom: 1px solid #000;
    height: 2.2cqi;
    align-items: center;
  }
  .strips .link { display: flex; justify-content: center; }
  #link { width: 7cqi; }
  #link-label { grid-area: 3 / 1; padding-top: 1.2cqi; text-align: center; line-height: 1.4; }
  .bay-label { text-align: center; line-height: 1.4; }
  .bay-label.empty { opacity: .45; }
  .asis { text-transform: none; }
  /* the name the disk has in zpool status, e.g. DISK-5YD7DCKZ */
  .zfs {
    display: block;
    margin-top: .2cqi;
    font: clamp(7px, 1.15cqi, 10px)/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0;
    text-transform: none;
    color: color-mix(in srgb, var(--muted) 75%, transparent);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #bay-labels > * { min-width: 0; max-width: 100%; }
  .bar { height: .7cqi; min-height: 3px; border-radius: .4cqi; }
  #bay-strips, #bay-labels {
    display: grid;
    grid-template-columns: repeat(var(--bays, 6), 1fr);
    gap: 1.2cqi;
    padding: 0 1.4cqi;
  }
  #bay-strips { justify-items: center; }
  .bay-lights { display: flex; align-items: center; gap: .9cqi; }
  .bay-lights .bar { width: 4.4cqi; }
  .bay-lights .dot { width: 1cqi; height: 1cqi; min-width: 5px; min-height: 5px; }
  /* under each bay strip: its number and disk */
  #bay-labels {
    grid-area: 3 / 2;
    padding-top: 1.2cqi;
    padding-bottom: 1.6cqi;
    justify-items: center;
  }
  /* drive bays: the strip is health (green = OK, red = errors, off =
     empty), the dot beside it glows dim green while the disk is busy */
  .lamp.act-on {
    background: color-mix(in srgb, var(--green) 45%, var(--led-off));
    box-shadow: 0 0 .6cqi color-mix(in srgb, var(--green) 40%, transparent);
  }

  footer {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  kbd {
    font: 11px ui-monospace, Menlo, monospace;
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 4px;
  }
  #warn { color: var(--red); }

  /* phones: give the display more of the band */
  @container (max-width: 520px) {
    .lcd { width: 60cqi; }
    .leds { gap: 2.4cqi; }
  }
</style>
</head>
<body>
<main>

  <div class="chassis">
    <div class="side-top"><h1 id="host">&nbsp;</h1></div>

    <div class="band">
      <div class="lcd-area">
        <div class="lcd" id="lcd" aria-live="polite">
          <div class="row" id="row0"></div>
          <div class="row" id="row1"></div>
        </div>
        <div class="buttons">
          <span class="label">Enter</span>
          <div class="keys">
            <button id="enter" aria-label="Enter"></button>
            <button id="select" aria-label="Select"></button>
          </div>
          <span class="label">Select</span>
        </div>
      </div>
      <div class="leds">
        <div class="led" id="status-wrap"><span class="lamp dot" id="status"></span><span class="label">Status</span></div>
        <div class="led" id="lan-wrap"><span class="lamp dot" id="lan"></span><span class="label">LAN</span></div>
        <div class="led undriven" title="not reported"><span class="lamp dot"></span><span class="label">USB</span></div>
        <div class="led undriven" title="not reported"><span class="lamp dot"></span><span class="label asis">eSATA</span></div>
      </div>
    </div>

    <div class="strips">
      <div class="link"><span class="lamp bar" id="link"></span></div>
      <div id="bay-strips"></div>
    </div>

    <div class="label" id="link-label" title="this page's connection to the NAS, not the power LED">Connecting<br><span class="asis">web link</span></div>
    <div id="bay-labels"></div>
  </div>

  <footer>
    <span><kbd>Enter</kbd> Enter &nbsp; <kbd>Space</kbd> Select</span>
    <span id="screen"></span>
    <span id="warn"></span>
  </footer>
</main>

<script>
const COLS = 16;
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const $ = id => document.getElementById(id);
const rows = [$('row0'), $('row1')];

for (const row of rows)
  for (let i = 0; i < COLS; i++) row.appendChild(document.createElement('span')).className = 'cell';

function render(s) {
  document.title = `${s.host} - front panel`;
  $('host').textContent = $('host').title = s.host;
  $('lcd').classList.toggle('lit', s.backlight);
  s.lines.forEach((text, r) => {
    const cells = rows[r].children;
    for (let i = 0; i < COLS; i++) cells[i].textContent = text[i] || ' ';
  });
  $('status').className = 'lamp dot' + (s.status_led ? ' ' + s.status_led : '');
  $('status-wrap').classList.toggle('undriven', !s.status_led_driven);
  $('status-wrap').title = s.status_led_driven ? '' : 'not driven on this machine (no qnapled or --no-status-led)';
  $('enter').classList.toggle('down', s.buttons.enter);
  $('select').classList.toggle('down', s.buttons.select);
  $('screen').textContent = s.prompt ? 'Enter = yes, Select = no' : `screen ${s.screen[0]} of ${s.screen[1]}`;
  $('warn').textContent = s.connected ? '' : 'serial port not open';
  const lan = s.lan || 'off';
  $('lan').className = 'lamp dot' + (lan === 'busy' ? ' amber-dim' : lan === 'on' ? ' amber' : '');
  $('lan-wrap').title = lan === 'off' ? 'LAN: no link' : lan === 'busy' ? 'LAN: link, traffic' : 'LAN: link';
  renderBays(s.bays || []);
}

function renderBays(bays) {
  const strips = $('bay-strips'), labels = $('bay-labels');
  if (strips.children.length !== bays.length) {
    document.querySelector('.chassis').style.setProperty('--bays', bays.length || 1);
    strips.innerHTML = labels.innerHTML = '';
    bays.forEach((_, i) => {
      const lights = strips.appendChild(document.createElement('span'));
      lights.className = 'bay-lights';
      lights.innerHTML = '<span class="lamp bar"></span><span class="lamp dot act"></span>';
      labels.appendChild(document.createElement('div')).className = 'label bay-label';
    });
  }
  bays.forEach((b, i) => {
    const health = b.state === 'error' ? ' red' : b.state === 'ok' ? ' green' : '';
    const zfs = b.zfs ? `${b.zfs[1]} in ${b.zfs[0]}` : 'not in a pool';
    const title = b.disk ? `bay ${i + 1}: ${b.disk}, ${zfs}${b.state === 'error' ? ' (errors)' : ''}${b.busy ? ', busy' : ''}` : `bay ${i + 1}: empty`;
    const [bar, act] = strips.children[i].children;
    bar.className = 'lamp bar' + health;
    act.className = 'lamp dot act' + (b.busy ? ' act-on' : '');
    strips.children[i].title = title;
    const label = labels.children[i];
    label.classList.toggle('empty', !b.disk);
    label.title = title;
    label.innerHTML = `${i + 1}<br><span class="asis">${b.disk || 'empty'}</span>`
      + `<span class="zfs">${b.zfs ? esc(b.zfs[1].split('/').pop()) : '&nbsp;'}</span>`;
  });
}

// where the power strip is on the NAS: whether this page is getting updates
function setConn(cls, text) {
  $('link').className = 'lamp bar' + (cls === 'live' ? ' green' : cls === 'down' ? ' red' : '');
  $('link-label').innerHTML = `${text}<br><span class="asis">web link</span>`;
  for (const b of ['enter', 'select']) $(b).disabled = cls !== 'live';
}

function connect() {
  const es = new EventSource('api/events');
  es.onopen = () => setConn('live', 'Live');
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => setConn('down', 'Offline');  // EventSource retries by itself
}

async function press(name) {
  try {
    const r = await fetch('api/button/' + name, { method: 'POST', headers: { 'X-QnapLCD': '1' } });
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    $('warn').textContent = `${name} failed: ${e.message}`;
  }
}

$('enter').addEventListener('click', () => press('enter'));
$('select').addEventListener('click', () => press('select'));
document.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter') { e.preventDefault(); press('enter'); }
  else if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); press('select'); }
});

connect();
</script>
</body>
</html>

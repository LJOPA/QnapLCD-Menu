<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front panel</title>
<style>
  :root {
    --bg: #1b1d21;
    --chassis: #26292d;
    --chassis-low: #1f2125;
    --band: #0e0f11;
    --tray: #16181b;
    --edge: #3a3e44;
    --text: #c9ccd1;
    --muted: #7d828a;
    --lcd-on: #2f6fd6;
    --lcd-on-edge: #4f8ae8;
    --lcd-off: #17233a;
    --char-on: #eef4ff;
    --char-off: #3b4a66;
    --led-off: #2a2d31;
    --green: #3ddc6a;
    --red: #ff4a3d;
    --amber: #ff9a2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: min(760px, 100%); }
  header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 12px;
  }
  #conn::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--muted);
    vertical-align: 0;
  }
  #conn.live::before { background: var(--green); }
  #conn.down::before { background: var(--red); }

  /*
   * Laid out like the TS-x69 front: a narrow left section (name, power
   * strip, Power and Copy) and, to its right, a dark band holding the
   * display, the two buttons and the small LEDs, above six drive trays.
   * The power strip and the bay strips share one line across the front.
   * Sizes are in cqi (percent of the chassis width) so it scales as one.
   */
  .chassis {
    container-type: inline-size;
    display: grid;
    grid-template-columns: 22% 1fr;
    grid-template-rows: auto auto 1fr;
    background: linear-gradient(180deg, var(--chassis), var(--chassis-low));
    border: 1px solid #000;
    border-radius: 2.2cqi 2.2cqi .8cqi .8cqi;
    box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    overflow: hidden;
  }
  .label {
    font-size: clamp(7px, 1.25cqi, 11px);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  /* left section */
  .side-top { grid-area: 1 / 1; padding: 4cqi 2.5cqi; }
  #host {
    margin: 0;
    font-size: clamp(11px, 2.6cqi, 22px);
    font-weight: 700;
    letter-spacing: .04em;
    color: #e3e5e8;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .side-bottom {
    grid-area: 3 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 1.6cqi;
    padding: 3cqi 0 3.5cqi;
  }
  .box {
    width: 10cqi;
    aspect-ratio: 1.45;
    border: 1px solid #000;
    border-radius: .7cqi;
    background: linear-gradient(180deg, #2c2f34, #222428);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .9cqi;
  }
  .usb { width: 3.6cqi; height: 1.5cqi; border: 1px solid #555a62; border-radius: .2cqi; background: #0b0c0e; }

  /* display band */
  .band {
    grid-area: 1 / 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 3cqi;
    padding: 3cqi 2.4cqi 2cqi 2.4cqi;
    background: linear-gradient(170deg, #1a1c1f, var(--band) 45%);
    border-left: 1px solid #000;
  }
  .lcd-area { display: flex; justify-content: flex-end; align-items: center; gap: 2cqi; }

  /* LCD: 2 rows x 16 character cells */
  .lcd {
    container-type: inline-size;
    width: 50cqi;
    background: var(--lcd-off);
    border: 2px solid #050607;
    padding: 1.1cqi 1.4cqi;
    transition: background .25s, box-shadow .25s;
  }
  .lcd.lit {
    background: radial-gradient(ellipse at center, var(--lcd-on-edge), var(--lcd-on) 75%);
    box-shadow: 0 0 2.4cqi rgba(79,138,232,.35);
  }
  .row { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1.2cqi; }
  .row + .row { margin-top: 1.6cqi; }
  .cell {
    aspect-ratio: 5 / 8;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,.05);
    border-radius: 1px;
    font: 600 clamp(7px, 5.2cqi, 24px)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--char-off);
    white-space: pre;
  }
  .lcd.lit .cell { color: var(--char-on); text-shadow: 0 0 4px rgba(238,244,255,.5); background: rgba(255,255,255,.07); }

  /* Enter over Select, small rectangular keys beside the display */
  .buttons { display: flex; flex-direction: column; align-items: center; gap: .5cqi; }
  .buttons .keys { display: flex; flex-direction: column; gap: .5cqi; }
  .buttons button {
    width: 4.2cqi;
    height: 4.2cqi;
    min-width: 22px;
    min-height: 22px;
    padding: 0;
    border: 1px solid #000;
    border-radius: .5cqi;
    background: linear-gradient(180deg, #3d4147, #23262a);
    box-shadow: 0 2px 0 #050607, inset 0 1px 0 rgba(255,255,255,.08);
    cursor: pointer;
    transition: transform .05s, box-shadow .05s;
  }
  .buttons button:hover { background: linear-gradient(180deg, #474c53, #282b30); }
  .buttons button:focus-visible { outline: 2px solid var(--lcd-on-edge); outline-offset: 2px; }
  .buttons button:active, .buttons button.down {
    transform: translateY(2px);
    box-shadow: 0 0 0 #050607, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .buttons button:disabled { cursor: default; opacity: .5; }

  /* small round LEDs, bottom left of the band */
  .leds { display: flex; gap: 3.2cqi; }
  .led { display: flex; flex-direction: column; align-items: center; gap: .9cqi; }
  .lamp {
    background: var(--led-off);
    border: 1px solid #000;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.6);
  }
  .dot { width: 1.5cqi; height: 1.5cqi; min-width: 7px; min-height: 7px; border-radius: 50%; }
  .lamp.green { background: var(--green); box-shadow: 0 0 1.2cqi var(--green); }
  .lamp.red   { background: var(--red);   box-shadow: 0 0 1.2cqi var(--red); }
  /* red on blinker 2 at ~1 Hz, green underneath: alternates */
  .lamp.alternate { animation: red-green 1s steps(1, end) infinite; }
  @keyframes red-green {
    0%  { background: var(--red);   box-shadow: 0 0 1.2cqi var(--red); }
    50% { background: var(--green); box-shadow: 0 0 1.2cqi var(--green); }
  }
  .led.undriven .lamp { opacity: .55; }
  /* LAN: amber with link, flickering with traffic */
  .lamp.amber { background: var(--amber); box-shadow: 0 0 1.2cqi var(--amber); }
  .lamp.amber-busy { animation: flicker-amber .18s steps(1, end) infinite; }
  @keyframes flicker-amber {
    0%  { background: var(--amber); box-shadow: 0 0 1.2cqi var(--amber); }
    50% { background: var(--led-off); box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
  }

  /* one line of strips across the front: power, then a strip per bay */
  .strips {
    grid-row: 2;
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 22% 1fr;
    background: #111214;
    border-top: 1px solid #000;
    border-bottom: 1px solid #000;
    height: 2.2cqi;
    align-items: center;
  }
  .strips .power { display: flex; justify-content: center; }
  .bar { height: .7cqi; min-height: 3px; border-radius: .4cqi; }
  #power { width: 7cqi; }
  #bay-strips, #trays {
    display: grid;
    grid-template-columns: repeat(var(--bays, 6), 1fr);
    gap: 1.2cqi;
    padding: 0 1.4cqi;
  }
  #bay-strips { justify-items: center; }
  #bay-strips .bar { width: 5cqi; }
  /* drive bay lights: green = disk present, flickering = I/O, red = error */
  .lamp.busy { animation: flicker .18s steps(1, end) infinite; }
  @keyframes flicker {
    0%  { background: var(--green); box-shadow: 0 0 1.2cqi var(--green); }
    50% { background: var(--led-off); box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
  }

  /* trays: shorter than the real ones, a latch circle and a grille */
  #trays {
    grid-area: 3 / 2;
    padding-top: 1.2cqi;
    padding-bottom: 1.6cqi;
    border-left: 1px solid #000;
  }
  .tray {
    height: 30cqi;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6cqi;
    padding: 2cqi 0 1.4cqi;
    background: linear-gradient(180deg, #1c1e21, var(--tray));
    border: 1px solid #000;
    border-radius: .5cqi;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  .tray.empty { opacity: .45; }
  .latch {
    width: 5.2cqi;
    aspect-ratio: 1;
    border-radius: 50%;
    border: .5cqi solid #0a0b0c;
    background: radial-gradient(circle at 40% 35%, #c9ccd1, #7d828a 70%);
    box-shadow: 0 0 0 1px #34383d;
  }
  .tray.empty .latch { background: #2a2d31; }
  .grille {
    flex: 1;
    width: 70%;
    background: repeating-linear-gradient(90deg, #0a0b0c 0 .5cqi, transparent .5cqi 1.4cqi);
    border-radius: .3cqi;
    opacity: .9;
  }
  .tray .label { text-align: center; line-height: 1.3; }
  .asis { text-transform: none; }

  footer {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  kbd {
    font: 11px ui-monospace, Menlo, monospace;
    border: 1px solid var(--edge);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0 4px;
  }
  #warn { color: var(--red); }

  /* phones: give the display more of the band */
  @container (max-width: 520px) {
    .lcd { width: 60cqi; }
    .leds { gap: 2.4cqi; }
  }
</style>
</head>
<body>
<main>
  <header><span id="conn">connecting</span></header>

  <div class="chassis">
    <div class="side-top"><h1 id="host">&nbsp;</h1></div>

    <div class="band">
      <div class="lcd-area">
        <div class="lcd" id="lcd" aria-live="polite">
          <div class="row" id="row0"></div>
          <div class="row" id="row1"></div>
        </div>
        <div class="buttons">
          <span class="label">Enter</span>
          <div class="keys">
            <button id="enter" aria-label="Enter"></button>
            <button id="select" aria-label="Select"></button>
          </div>
          <span class="label">Select</span>
        </div>
      </div>
      <div class="leds">
        <div class="led" id="status-wrap"><span class="lamp dot" id="status"></span><span class="label">Status</span></div>
        <div class="led" id="lan-wrap"><span class="lamp dot" id="lan"></span><span class="label">LAN</span></div>
        <div class="led undriven" title="not reported"><span class="lamp dot"></span><span class="label">USB</span></div>
        <div class="led undriven" title="not reported"><span class="lamp dot"></span><span class="label asis">eSATA</span></div>
      </div>
    </div>

    <div class="strips">
      <div class="power" title="power"><span class="lamp bar green" id="power"></span></div>
      <div id="bay-strips"></div>
    </div>

    <div class="side-bottom" aria-hidden="true">
      <div class="box"><span class="label">&#x23FB; Power</span></div>
      <div class="box"><span class="label">Copy</span><span class="usb"></span></div>
    </div>

    <div id="trays"></div>
  </div>

  <footer>
    <span><kbd>Enter</kbd> Enter &nbsp; <kbd>Space</kbd> Select</span>
    <span id="screen"></span>
    <span id="warn"></span>
  </footer>
</main>

<script>
const COLS = 16;
const $ = id => document.getElementById(id);
const rows = [$('row0'), $('row1')];

for (const row of rows)
  for (let i = 0; i < COLS; i++) row.appendChild(document.createElement('span')).className = 'cell';

function render(s) {
  document.title = `${s.host} - front panel`;
  $('host').textContent = s.host;
  $('lcd').classList.toggle('lit', s.backlight);
  s.lines.forEach((text, r) => {
    const cells = rows[r].children;
    for (let i = 0; i < COLS; i++) cells[i].textContent = text[i] || ' ';
  });
  $('status').className = 'lamp dot' + (s.status_led ? ' ' + s.status_led : '');
  $('status-wrap').classList.toggle('undriven', !s.status_led_driven);
  $('status-wrap').title = s.status_led_driven ? '' : 'not driven on this machine (no qnapled or --no-status-led)';
  $('enter').classList.toggle('down', s.buttons.enter);
  $('select').classList.toggle('down', s.buttons.select);
  $('screen').textContent = s.prompt ? 'Enter = yes, Select = no' : `screen ${s.screen[0]} of ${s.screen[1]}`;
  $('warn').textContent = s.connected ? '' : 'serial port not open';
  const lan = s.lan || 'off';
  $('lan').className = 'lamp dot' + (lan === 'busy' ? ' amber-busy' : lan === 'on' ? ' amber' : '');
  $('lan-wrap').title = lan === 'off' ? 'LAN: no link' : lan === 'busy' ? 'LAN: link, traffic' : 'LAN: link';
  renderBays(s.bays || []);
}

function renderBays(bays) {
  const strips = $('bay-strips'), trays = $('trays');
  if (strips.children.length !== bays.length) {
    document.querySelector('.chassis').style.setProperty('--bays', bays.length || 1);
    strips.innerHTML = trays.innerHTML = '';
    bays.forEach((_, i) => {
      strips.appendChild(document.createElement('span')).className = 'lamp bar';
      const tray = trays.appendChild(document.createElement('div'));
      tray.className = 'tray';
      tray.innerHTML = '<span class="latch"></span><span class="grille"></span><span class="label"></span>';
    });
  }
  bays.forEach((b, i) => {
    const on = b.state === 'error' ? ' red' : b.state === 'ok' ? (b.busy ? ' busy' : ' green') : '';
    const title = b.disk ? `bay ${i + 1}: ${b.disk}${b.state === 'error' ? ' (errors)' : ''}` : `bay ${i + 1}: empty`;
    strips.children[i].className = 'lamp bar' + on;
    strips.children[i].title = title;
    const tray = trays.children[i];
    tray.classList.toggle('empty', !b.disk);
    tray.title = title;
    tray.querySelector('.label').innerHTML = `${i + 1}<br><span class="asis">${b.disk || '&nbsp;'}</span>`;
  });
}

function setConn(cls, text) {
  $('conn').className = cls;
  $('conn').textContent = text;
  for (const b of ['enter', 'select']) $(b).disabled = cls !== 'live';
}

function connect() {
  const es = new EventSource('api/events');
  es.onopen = () => setConn('live', 'live');
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => setConn('down', 'reconnecting');  // EventSource retries by itself
}

async function press(name) {
  try {
    const r = await fetch('api/button/' + name, { method: 'POST', headers: { 'X-QnapLCD': '1' } });
    if (!r.ok) throw new Error(r.status);
  } catch (e) {
    $('warn').textContent = `${name} failed: ${e.message}`;
  }
}

$('enter').addEventListener('click', () => press('enter'));
$('select').addEventListener('click', () => press('select'));
document.addEventListener('keydown', e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter') { e.preventDefault(); press('enter'); }
  else if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); press('select'); }
});

connect();
</script>
</body>
</html>
